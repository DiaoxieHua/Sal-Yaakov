<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Survival Shooter</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        background: radial-gradient(circle at top, #1c2748 0%, #0b1020 60%, #05070f 100%);
        overflow: hidden;
      }

      #gameCanvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }

      .hud {
        position: fixed;
        top: 14px;
        left: 16px;
        display: flex;
        gap: 16px;
        align-items: center;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #e8edff;
        text-shadow: 0 0 8px rgba(113, 173, 255, 0.35);
        pointer-events: none;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        background: rgba(3, 7, 20, 0.55);
        color: #f5f7ff;
      }

      .panel {
        background: rgba(7, 16, 39, 0.82);
        border: 1px solid rgba(144, 194, 255, 0.32);
        border-radius: 16px;
        padding: 24px 26px;
        min-width: min(90vw, 420px);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
      }

      .panel h1 {
        margin: 0 0 10px;
        font-size: 30px;
      }

      .panel p {
        margin: 8px 0;
        line-height: 1.45;
        color: #d8dfff;
      }

      .hidden {
        display: none;
      }

      .accent {
        color: #7ed6ff;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <span id="scoreLabel">Score: 0</span>
      <span id="hpLabel">HP: 100</span>
    </div>

    <div id="startOverlay" class="overlay">
      <div class="panel">
        <h1>生存射擊</h1>
        <p>移動：<span class="accent">WASD / 方向鍵</span></p>
        <p>射擊：<span class="accent">滑鼠左鍵</span>（朝游標方向）</p>
        <p>按下 <span class="accent">Enter</span> 開始遊戲</p>
      </div>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <div class="panel">
        <h1>遊戲結束</h1>
        <p id="finalScore">最終分數：0</p>
        <p>按下 <span class="accent">Enter</span> 重新開始</p>
      </div>
    </div>

    <script>
      // Step 1: Canvas and basic setup
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const scoreLabel = document.getElementById("scoreLabel");
      const hpLabel = document.getElementById("hpLabel");
      const startOverlay = document.getElementById("startOverlay");
      const gameOverOverlay = document.getElementById("gameOverOverlay");
      const finalScore = document.getElementById("finalScore");

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      class InputHandler {
        constructor() {
          this.keys = new Set();
          this.mouse = { x: canvas.width / 2, y: canvas.height / 2 };

          window.addEventListener("keydown", (e) => this.onKeyDown(e));
          window.addEventListener("keyup", (e) => this.onKeyUp(e));
          canvas.addEventListener("mousemove", (e) => this.onMouseMove(e));
        }

        onKeyDown(e) {
          const key = e.key.toLowerCase();
          if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", "enter"].includes(key)) {
            e.preventDefault();
          }
          this.keys.add(key);
        }

        onKeyUp(e) {
          this.keys.delete(e.key.toLowerCase());
        }

        onMouseMove(e) {
          const rect = canvas.getBoundingClientRect();
          this.mouse.x = e.clientX - rect.left;
          this.mouse.y = e.clientY - rect.top;
        }

        isDown(...codes) {
          return codes.some((code) => this.keys.has(code));
        }
      }

      class Player {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.radius = 16;
          this.speed = 280;
          this.hp = 100;
          this.invincibleTimer = 0;
        }

        update(dt, input, width, height) {
          let dx = 0;
          let dy = 0;

          if (input.isDown("w", "arrowup")) dy -= 1;
          if (input.isDown("s", "arrowdown")) dy += 1;
          if (input.isDown("a", "arrowleft")) dx -= 1;
          if (input.isDown("d", "arrowright")) dx += 1;

          const len = Math.hypot(dx, dy);
          if (len > 0) {
            dx /= len;
            dy /= len;
          }

          this.x += dx * this.speed * dt;
          this.y += dy * this.speed * dt;

          this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
          this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));

          if (this.invincibleTimer > 0) {
            this.invincibleTimer -= dt;
          }
        }

        draw(ctx, mouse) {
          const angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);

          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(angle);

          ctx.fillStyle = this.invincibleTimer > 0 ? "#ffd966" : "#5ee7ff";
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#c4f4ff";
          ctx.beginPath();
          ctx.moveTo(this.radius - 2, 0);
          ctx.lineTo(this.radius + 11, -5);
          ctx.lineTo(this.radius + 11, 5);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }

        takeDamage(amount) {
          if (this.invincibleTimer > 0) return;
          this.hp = Math.max(0, this.hp - amount);
          this.invincibleTimer = 0.35;
        }
      }

      class Projectile {
        constructor(x, y, angle) {
          this.x = x;
          this.y = y;
          this.radius = 5;
          this.speed = 560;
          this.vx = Math.cos(angle) * this.speed;
          this.vy = Math.sin(angle) * this.speed;
          this.life = 1.3;
        }

        update(dt) {
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          this.life -= dt;
        }

        draw(ctx) {
          ctx.fillStyle = "#f9f871";
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        get alive() {
          return this.life > 0;
        }
      }

      class Enemy {
        constructor(x, y, speed, radius) {
          this.x = x;
          this.y = y;
          this.speed = speed;
          this.radius = radius;
        }

        update(dt, player) {
          const dx = player.x - this.x;
          const dy = player.y - this.y;
          const len = Math.hypot(dx, dy) || 1;
          this.x += (dx / len) * this.speed * dt;
          this.y += (dy / len) * this.speed * dt;
        }

        draw(ctx) {
          ctx.fillStyle = "#ff6f91";
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "rgba(255, 199, 214, 0.65)";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      class Particle {
        constructor(x, y, color) {
          this.x = x;
          this.y = y;
          const angle = Math.random() * Math.PI * 2;
          const speed = 45 + Math.random() * 170;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.radius = 1.5 + Math.random() * 2.5;
          this.life = 0.45 + Math.random() * 0.45;
          this.maxLife = this.life;
          this.color = color;
        }

        update(dt) {
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          this.vx *= 0.96;
          this.vy *= 0.96;
          this.life -= dt;
        }

        draw(ctx) {
          const alpha = Math.max(0, this.life / this.maxLife);
          ctx.fillStyle = this.color.replace("ALPHA", alpha.toFixed(3));
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        get alive() {
          return this.life > 0;
        }
      }

      class GameEngine {
        constructor(ctx, width, height) {
          this.ctx = ctx;
          this.width = width;
          this.height = height;
          this.input = new InputHandler();

          this.state = "start"; // start | running | gameover
          this.player = null;
          this.projectiles = [];
          this.enemies = [];
          this.particles = [];

          this.score = 0;
          this.spawnTimer = 0;
          this.spawnInterval = 0.85;
          this.fireCooldown = 0;
          this.fireRate = 0.15;

          this.lastTime = 0;

          canvas.addEventListener("mousedown", (e) => {
            if (e.button !== 0) return;
            if (this.state === "running") this.fireProjectile();
          });
        }

        reset() {
          this.player = new Player(this.width / 2, this.height / 2);
          this.projectiles = [];
          this.enemies = [];
          this.particles = [];
          this.score = 0;
          this.spawnTimer = 0;
          this.spawnInterval = 0.85;
          this.fireCooldown = 0;

          scoreLabel.textContent = "Score: 0";
          hpLabel.textContent = "HP: 100";
        }

        start() {
          this.reset();
          this.state = "running";
          startOverlay.classList.add("hidden");
          gameOverOverlay.classList.add("hidden");
        }

        gameOver() {
          this.state = "gameover";
          finalScore.textContent = `最終分數：${this.score}`;
          gameOverOverlay.classList.remove("hidden");
        }

        spawnEnemy() {
          const side = Math.floor(Math.random() * 4);
          let x;
          let y;
          const pad = 30;

          if (side === 0) {
            x = Math.random() * this.width;
            y = -pad;
          } else if (side === 1) {
            x = this.width + pad;
            y = Math.random() * this.height;
          } else if (side === 2) {
            x = Math.random() * this.width;
            y = this.height + pad;
          } else {
            x = -pad;
            y = Math.random() * this.height;
          }

          const radius = 12 + Math.random() * 8;
          const speed = 65 + Math.random() * 80 + this.score * 0.5;
          this.enemies.push(new Enemy(x, y, speed, radius));
        }

        fireProjectile() {
          if (!this.player || this.fireCooldown > 0) return;
          const angle = Math.atan2(this.input.mouse.y - this.player.y, this.input.mouse.x - this.player.x);
          this.projectiles.push(new Projectile(this.player.x, this.player.y, angle));
          this.fireCooldown = this.fireRate;
        }

        circleCollides(a, b) {
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const rs = a.radius + b.radius;
          return dx * dx + dy * dy <= rs * rs;
        }

        spawnDeathParticles(enemy) {
          const count = 8 + Math.floor(Math.random() * 8);
          for (let i = 0; i < count; i++) {
            this.particles.push(new Particle(enemy.x, enemy.y, "rgba(255, 111, 145, ALPHA)"));
          }
        }

        update(dt) {
          this.width = canvas.width;
          this.height = canvas.height;

          if (this.input.isDown("enter")) {
            if (this.state === "start" || this.state === "gameover") {
              this.start();
              this.input.keys.delete("enter");
            }
          }

          if (this.state !== "running") {
            return;
          }

          this.player.update(dt, this.input, this.width, this.height);

          this.spawnTimer += dt;
          if (this.spawnTimer >= this.spawnInterval) {
            this.spawnEnemy();
            this.spawnTimer = 0;
            this.spawnInterval = Math.max(0.35, this.spawnInterval - 0.004);
          }

          if (this.fireCooldown > 0) this.fireCooldown -= dt;

          for (const projectile of this.projectiles) projectile.update(dt);
          for (const enemy of this.enemies) enemy.update(dt, this.player);
          for (const particle of this.particles) particle.update(dt);

          // Step 6: Circle collision detection
          for (let i = this.enemies.length - 1; i >= 0; i--) {
            const enemy = this.enemies[i];

            if (this.circleCollides(enemy, this.player)) {
              this.player.takeDamage(14);
              this.enemies.splice(i, 1);
              this.spawnDeathParticles(enemy);
              if (this.player.hp <= 0) {
                hpLabel.textContent = "HP: 0";
                this.gameOver();
                return;
              }
            }
          }

          for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const proj = this.projectiles[i];
            let hit = false;

            for (let j = this.enemies.length - 1; j >= 0; j--) {
              const enemy = this.enemies[j];
              if (this.circleCollides(proj, enemy)) {
                this.enemies.splice(j, 1);
                hit = true;
                this.score += 10;
                this.spawnDeathParticles(enemy);
                break;
              }
            }

            if (hit || !proj.alive) {
              this.projectiles.splice(i, 1);
            }
          }

          this.particles = this.particles.filter((p) => p.alive);

          scoreLabel.textContent = `Score: ${this.score}`;
          hpLabel.textContent = `HP: ${Math.ceil(this.player.hp)}`;
        }

        drawBackgroundGrid() {
          const gap = 38;
          this.ctx.strokeStyle = "rgba(147, 169, 255, 0.08)";
          this.ctx.lineWidth = 1;

          for (let x = 0; x < this.width; x += gap) {
            this.ctx.beginPath();
            this.ctx.moveTo(x, 0);
            this.ctx.lineTo(x, this.height);
            this.ctx.stroke();
          }

          for (let y = 0; y < this.height; y += gap) {
            this.ctx.beginPath();
            this.ctx.moveTo(0, y);
            this.ctx.lineTo(this.width, y);
            this.ctx.stroke();
          }
        }

        draw() {
          this.ctx.clearRect(0, 0, this.width, this.height);
          this.drawBackgroundGrid();

          if (this.state === "running") {
            this.player.draw(this.ctx, this.input.mouse);
            this.projectiles.forEach((p) => p.draw(this.ctx));
            this.enemies.forEach((e) => e.draw(this.ctx));
            this.particles.forEach((p) => p.draw(this.ctx));
          }
        }

        loop = (timestamp) => {
          if (!this.lastTime) this.lastTime = timestamp;
          const dt = Math.min(0.033, (timestamp - this.lastTime) / 1000);
          this.lastTime = timestamp;

          this.update(dt);
          this.draw();

          requestAnimationFrame(this.loop);
        };
      }

      const game = new GameEngine(ctx, canvas.width, canvas.height);
      requestAnimationFrame(game.loop);
    </script>
  </body>
</html>
